name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (Windows, Python 3.12)
    # El bot depende de Windows: OCR (WinRT), notificaciones y sonido.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv instala la versión de Python fijada en .python-version (3.12).
      - name: Instalar uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      # Sin un idioma OCR español en el runner ni las capturas privadas de
      # tests/fixtures/privadas/, esas pruebas se omiten con su motivo.
      - name: Ejecutar pruebas
        run: uv run --locked pytest -q -rs
